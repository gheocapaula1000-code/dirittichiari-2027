# Sito statico: nessuna build, si pubblica la cartella così com'è.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# /index.html non deve restare visibile; le pagine pulite servono lo stesso guscio.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/stima"
  to = "/"
  status = 200
[[redirects]]
  from = "/risultati"
  to = "/"
  status = 200
[[redirects]]
  from = "/ottimizzazione"
  to = "/"
  status = 200
[[redirects]]
  from = "/checklist-dsu"
  to = "/"
  status = 200
[[redirects]]
  from = "/diritti-pa"
  to = "/"
  status = 200
[[redirects]]
  from = "/fonti"
  to = "/"
  status = 200
[[redirects]]
  from = "/contatti"
  to = "/"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/"
  status = 200
