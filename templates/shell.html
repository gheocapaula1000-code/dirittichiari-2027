<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Language" content="{{CONTENT_LANGUAGE}}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{ROBOTS}}<meta name="theme-color" content="#0e5a8a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{APPLE_TITLE}}">
{{CANONICAL}}{{HREFLANG}}<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{LOCALE}}">
<meta property="og:site_name" content="{{OG_SITE}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="https://dirittiok.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://dirittiok.com/og-image.png">
<meta name="twitter:image:alt" content="{{OG_ALT}}">
<script type="application/ld+json">
{{JSON_LD}}
</script>
<link rel="stylesheet" href="/css/app.css?v={{VERSION}}">
<link rel="stylesheet" href="/css/modulo-contatti.css?v={{VERSION}}">
</head>
<body class="{{BODY_CLASS}}">
<a class="skip" href="#app">{{SKIP}}</a>
<div class="ptr" id="ptr" aria-hidden="true">{{PTR_PULL}}</div>

<header class="topbar">
  <div class="topbar-inner">
    <img src="/icons/icon-192.png" alt="" width="34" height="34">
    <a class="brand-name" href="{{HOME_HREF}}" data-route=""><span class="notranslate" translate="no">{{BRAND_NAME}}</span><span class="brand-sub">{{TAGLINE}}</span></a>
    {{SWITCHER}}
  </div>
</header>

<main id="app" tabindex="-1">
{{MAIN}}
</main>

<footer class="site">
  <p>{{FOOTER_OWNER}}</p>
  <p class="small">{{FOOTER_LEGAL}}</p>
  <p class="small no-print">{{FOOTER_LINKS}} · <button type="button" class="btn btn-danger" data-action="clear">{{FOOTER_CLEAR}}</button></p>
  <p class="small muted" id="version-label"></p>
</footer>

<nav class="bottomnav" aria-label="{{NAV_LABEL}}">
  <ul>
    <li><a href="{{HREF_HOME}}" data-nav="home" data-route=""><span class="ni" aria-hidden="true">🏠</span>{{NAV_HOME}}</a></li>
    <li><a href="{{HREF_STIMA}}" data-nav="stima" data-route="stima"><span class="ni" aria-hidden="true">🧭</span>{{NAV_STIMA}}</a></li>
    <li><a href="{{HREF_RISULTATI}}" data-nav="risultati" data-route="risultati"><span class="ni" aria-hidden="true">📊</span>{{NAV_RISULTATI}}</a></li>
    <li><a href="{{HREF_CONSIGLI}}" data-nav="consigli" data-route="consigli"><span class="ni" aria-hidden="true">💡</span>{{NAV_CONSIGLI}}</a></li>
    <li><a href="{{HREF_DOCUMENTI}}" data-nav="documenti" data-route="documenti"><span class="ni" aria-hidden="true">📄</span>{{NAV_DOCUMENTI}}</a></li>
  </ul>
</nav>

<div class="update-banner" id="update-banner" role="status" hidden>
  <p>{{UPDATE_MSG}}</p>
  <button type="button" class="btn btn-primary" id="update-apply">{{UPDATE_APPLY}}</button>
  <button type="button" class="btn btn-ghost" id="update-dismiss">{{UPDATE_LATER}}</button>
</div>

<div class="install-banner" id="install-banner" role="region" aria-label="{{INSTALL_CTA}}" hidden></div>

<script src="/js/rules.js?v={{VERSION}}"></script>
<script src="/js/version.js?v={{VERSION}}"></script>
<script src="/js/messages.js?v={{VERSION}}"></script>
<script src="/js/i18n.js?v={{VERSION}}"></script>
<script src="/js/pages-data.js?v={{VERSION}}"></script>
<script src="/js/modulo-contatti.js?v={{VERSION}}"></script>
<script src="/js/installa.js?v={{VERSION}}"></script>
<script src="/js/app.js?v={{VERSION}}"></script>
</body>
</html>
